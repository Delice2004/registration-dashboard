<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Event Registration Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen transition-all duration-500">

<!-- Navbar -->
<nav class="bg-slate-950/80 backdrop-blur-xl text-white sticky top-0 z-50 border-b border-white/10 shadow-lg">
  <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">

    <h1 class="text-2xl font-black tracking-wide bg-gradient-to-r from-pink-400 to-indigo-400 bg-clip-text text-transparent">
      EventDash
    </h1>

    <div class="flex items-center gap-3">
      <button
        id="themeToggle"
        class="bg-white/10 border border-white/20 backdrop-blur-xl px-4 py-2 rounded-xl hover:bg-white hover:text-slate-900 transition"
      >
        Dark Mode
      </button>

      <input
        type="text"
        id="searchInput"
        placeholder="Search events..."
        class="px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-300 focus:outline-none w-full md:w-72"
      />
    </div>
  </div>
</nav>
